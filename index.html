{title:'Escena del crimen',desc:'Inspeccionad la finca y detectad la vía de acceso ignorada.',docs:[['E01','Parte de hallazgo','22:31. Ada encuentra a Gabriel en el despacho. Puerta principal cerrada pero sin llave; el acceso de servicio comunica con la sala de arte. No hay ventanas abiertas.'],['E02','Croquis del inmueble','La sala de arte comunica con el despacho por un paso de servicio. El invernadero comunica con el corredor este. La cámara P1 cubre el corredor principal, no el paso de servicio.'],['E03','Objeto recuperado','Pisapapeles metálico junto al escritorio. No se atribuye todavía ninguna huella o fibra.'],['E04','Primeras posiciones','Ada dice estar en la biblioteca; Bruno en el archivo; Clara en el invernadero; Diego en la caseta. Las posiciones no están verificadas.']],photos:[0,1,5],gate:{question:'¿Qué ruta permite entrar al despacho sin pasar por la cámara P1?',options:['La ventana exterior','El paso desde la sala de arte','El garaje'],correct:1,explain:'El plano muestra una entrada secundaria desde la sala de arte.'}},
{title:'Testimonios',desc:'Preguntad, escuchad y contrastad las coartadas.',docs:[['T01','Declaración de Ada','«Discutí con Gabriel por la herencia. Me fui a la biblioteca. A las 22:31 fui a buscarlo y lo encontré».'],['T02','Declaración de Bruno','«Estuve revisando facturas en el archivo. No toqué las cámaras y no entré al despacho».'],['T03','Declaración de Clara','«Estuve toda la franja de 22:04 a 22:20 en el invernadero. Oí la ventilación encenderse sobre las 22:11».'],['T04','Declaración de Diego','«Permanecí en la caseta de vigilancia. No me ausenté durante el apagón».']],photos:[4],gate:{question:'¿Qué declaración concreta deberá verificarse con registros técnicos?',options:['La afirmación de que una persona permaneció en un lugar todo el tiempo','El color de las paredes del despacho','La hora a la que comenzó a llover'],correct:0,explain:'Las coartadas continuas son contrastables con sensores, lectores y cámaras.'}},
{title:'Registros',desc:'Reconstruid lo que realmente se registró entre las 22:04 y las 22:21.',docs:[['R01','Lectores de acceso','22:04 · Puerta invernadero abierta. 22:10 · C-04 entra desde sala de arte al despacho. 22:16 · C-04 sale hacia sala de arte. 22:21 · D-03 entra en caseta. Tarjetas: A-01 Ada; B-02 Bruno; C-04 Clara; D-03 Diego. Los lectores registran tarjetas, no rostros.'],['R02','Servidor de vídeo','22:05:48 · Usuario B.LEON inicia sesión. 22:06:02 · P1 pausada manualmente. 22:17:09 · P1 reanudada. La cámara S2 tiene alimentación independiente.'],['R03','Registro telefónico','Diego mantuvo una llamada personal de 22:07 a 22:15. El control de rondas no muestra entrada a caseta hasta las 22:21.'],['R04','Nota de sincronización','Los relojes del sistema de acceso y del servidor están sincronizados. La hora de los testimonios es aproximada.']],photos:[3],gate:{question:'¿Qué registro conecta una tarjeta con la ruta secundaria durante la ventana crítica?',options:['D-03 a las 22:21','C-04 a las 22:10 y 22:16','B-02 a las 22:05'],correct:1,explain:'La tarjeta C-04 está asociada a Clara, aunque eso no identifica de forma biométrica a quien la llevaba.'}},
{title:'Laboratorio',desc:'Unid indicios físicos y temporales sin confundir compatibilidad con certeza.',docs:[['F01','Informe médico (no gráfico)','Fallecimiento estimado entre 22:11 y 22:17. Un único impacto con objeto contundente, compatible con el pisapapeles. Sin signos claros de forcejeo prolongado.'],['F02','Microtraza','En una hendidura del pisapapeles aparece una fibra azul oscuro con partículas de pigmento verde de restauración. No permite identificación individual mediante ADN.'],['F03','Vestuario','Ada: vestido granate. Bruno: traje gris. Diego: uniforme negro. Clara: bata azul oscuro con pérdida de hilo en puño derecho y restos de pigmento verde del taller.'],['F04','Cámara S2','Fotograma 22:15:42: silueta parcial sale por el paso de servicio. No se reconoce rostro ni color fiable de ropa.']],photos:[2,3],gate:{question:'¿Qué combinación sostiene mejor la hipótesis de una visita al despacho en la ventana forense?',options:['Rumores de herencia y lluvia','Registro C-04, S2 y microtraza','Pausa de P1 por sí sola'],correct:1,explain:'Convergen oportunidad, ruta y material; ninguno es concluyente por sí solo.'}},
{title:'Los secretos',desc:'Separad las mentiras que encubren otros hechos de las que afectan al crimen.',docs:[['G01','Ampliación de Bruno','«Sí, pausé P1 para exportar documentos contables sin autorización. Temía que Gabriel los destruyera. No entré en el despacho». La sesión técnica confirma la pausa, no su ubicación exacta.'],['G02','Automatismos del invernadero','22:04 · Puerta abierta manualmente. 22:11 · Ventilación automática programada. 22:20 · Puerta cerrada manualmente. Oír el ventilador NO demuestra presencia humana.'],['G03','Inventario de arte','La obra a inspeccionar al día siguiente estaba bajo custodia de Clara. Hay irregularidades en su procedencia y posible sustitución, aún no confirmadas.'],['G04','Advertencia metodológica','Una tarjeta puede prestarse. Una fibra no identifica de modo único. Una silueta no es un rostro. Acusad por convergencia y explicad las alternativas.']],photos:[5],gate:{question:'¿Qué afirmación deja de ser una coartada cuando se conoce el automatismo?',options:['La ventilación del invernadero prueba que Clara seguía allí','La pausa de P1 existió','El despacho tenía una entrada de servicio'],correct:0,explain:'El ventilador se activó automáticamente y no confirma presencia de Clara.'}},
{title:'Acusación final',desc:'Presentad un razonamiento completo antes de abrir el desenlace.',docs:[],photos:[],gate:null}

const SUS=[{id:'Ada',name:'Ada Vega',role:'Familiar de Gabriel',base:'Discusión por la herencia.',qs:[['¿Dónde estabas entre 22:10 y 22:17?','En la biblioteca. Estaba alterada y quería evitar otra discusión.'],['¿Por qué discutiste con Gabriel?','Por el reparto de la herencia. No voy a fingir que nos llevábamos bien.'],['¿Cuándo entraste al despacho?','A las 22:31. Fui a buscarlo y encontré el cuerpo.']]},{id:'Bruno',name:'Bruno León',role:'Responsable financiero',base:'Custodiaba documentación contable.',qs:[['¿Tocaste las cámaras?','No tenía motivo para tocar las cámaras.'],['¿Qué hacías en el archivo?','Revisaba documentación que Gabriel había pedido.'],['Confrontar sesión B.LEON (R02)','De acuerdo: pausé P1 para exportar archivos. Lo oculté porque era una extracción no autorizada. No prueba que entrara al despacho.']]},{id:'Clara',name:'Clara Vega',role:'Conservadora de arte',base:'Responsable de las obras de la finca.',qs:[['¿Dónde estabas durante el apagón?','En el invernadero. Oí la ventilación y no salí hasta después.'],['¿Quién tenía la tarjeta C-04?','Estaba asignada a mí. Pero una tarjeta no identifica a quien la usa.'],['Confrontar automatismo del invernadero (G02)','Que la ventilación fuera automática no cambia lo que recuerdo. No tengo a nadie que pueda corroborarlo.'],['Confrontar inventario y microtraza (G03/F02)','La obra estaba bajo mi responsabilidad y trabajo con ese pigmento. Eso no significa que yo usara el pisapapeles.']]},{id:'Diego',name:'Diego Roca',role:'Responsable de seguridad',base:'Debía vigilar la finca.',qs:[['¿Permaneciste en la caseta?','Eso dije al principio. No quería problemas con mi puesto.'],['Confrontar registro D-03 (R01)','Salí para una llamada personal. Regresé a las 22:21. Mentí sobre mi ronda.'],['¿Viste entrar a alguien al despacho?','No. Durante ese tramo no tenía visión directa del paso de servicio.']]}];
const TIMES=[['22:04','Se abre el invernadero'],['22:06','P1 deja de grabar'],['22:10','C-04 entra al despacho'],['22:11–22:17','Ventana forense'],['22:15:42','S2 registra una silueta'],['22:16','C-04 sale del despacho'],['22:17','P1 reanuda'],['22:21','D-03 vuelve a caseta'],['22:31','Ada encuentra a Gabriel']];
const KEY='villa-olmo-reconstruido-v2';let st;try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){};st=Object.assign({stage:0,view:'inicio',notes:'',seen:[],interviews:{},links:[],order:[],hints:0,accusation:null,solved:false,started:Date.now()},st||{});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(st))}function goto(v){st.view=v;save();render()}function stage(i){if(i>st.stage)return;st.view='fase';st.current=i;save();render()}function header(t,sub=''){return `<div class="eyebrow">EXPEDIENTE VO-24-11 · INVESTIGACIÓN FICTICIA</div><h2>${t}</h2><p class="muted">${sub}</p>`}function openPhoto(i){$('modalbody').innerHTML=`<div class="row between"><strong>FOTOGRAFÍA ${String(i+1).padStart(2,'0')} · Recreación</strong><button onclick="closeModal()">Cerrar ✕</button></div><img src="${IMAGES[i]}"><p class="muted">Imagen de ambientación: los documentos textuales prevalecen sobre detalles visuales ambiguos.</p>`;$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show')}function openDoc(i,j){let d=CH[i].docs[j];st.seen=[...new Set([...st.seen,d[0]])];save();$('modalbody').innerHTML=`<div class="row between"><strong>${esc(d[0])} · DOCUMENTO INCORPORADO</strong><button onclick="closeModal()">Cerrar ✕</button></div><article class="paper"><small>UNIDAD DE INVESTIGACIÓN · CASO VO-24-11</small><h2>${esc(d[1])}</h2><p style="white-space:pre-line;font-size:19px">${esc(d[2])}</p><hr><small>Documento ficticio · Uso lúdico</small></article>`;$('modal').classList.add('show')}
function nav(){return `<button class="${st.view==='inicio'?'active':''}" onclick="goto('inicio')">◈ Inicio</button>`+CH.map((c,i)=>`<button ${i>st.stage?'disabled':''} class="${st.view==='fase'&&((st.current??st.stage)===i)?'active':''}" onclick="stage(${i})">${i<st.stage?'✓':i===st.stage?'●':'🔒'} Sobre ${i+1} · ${c.title}</button>`).join('')+`<hr><button onclick="goto('tablero')">⌁ Tablero de pruebas</button><button onclick="goto('interrogatorios')">◉ Interrogatorios</button><button onclick="goto('cronologia')">◷ Cronología</button><button onclick="goto('cuaderno')">✎ Cuaderno</button>`}
function intro(){return `<div class="hero"><div><div class="eyebrow">UNA NOCHE · CUATRO SOSPECHOSOS · UNA VERDAD</div><h1>La última noche<br>en Villa Olmo</h1><p>Gabriel Vega ha aparecido sin vida en su despacho. Las cámaras dejaron de grabar durante once minutos. Todos ocultan algo. No todos ocultan lo mismo.</p><p><span class="chip">2 jugadores</span> <span class="chip">6 sobres</span> <span class="chip">Misterio clásico</span></p><p>Explorad los documentos, interrogad a los sospechosos, contrastad las pruebas y reconstruid el suceso. La solución no se revelará hasta vuestra acusación final.</p><button class="primary" onclick="stage(${st.stage})">${st.stage?'Continuar investigación':'Abrir el sobre 1'} →</button></div><img src="${IMAGES[0]}" alt="Villa Olmo"></div><div class="rule"></div><div class="grid"><div class="card"><h3>Para jugar en la televisión</h3>Conectad el ordenador por HDMI, pulsad F11 y utilizad el ratón para examinar las pruebas.</div><div class="card"><h3>Progreso guardado</h3>Se guarda en este navegador. Evitad modo incógnito. No reiniciéis durante la partida.</div><div class="card"><h3>Cooperación</h3>Una persona puede reconstruir la cronología y la otra contrastar declaraciones. Intercambiad hipótesis.</div></div>`}
function phase(i){let c=CH[i];let photos=c.photos.map(n=>`<div class="card evidence"><img src="${IMAGES[n]}" onclick="openPhoto(${n})" alt="Recreación ${n+1}"><span class="label">FOTO ${String(n+1).padStart(2,'0')}</span><button onclick="openPhoto(${n})">Ampliar fotografía ↗</button></div>`).join('');let docs=c.docs.map((d,j)=>`<div class="card evidence"><span class="label">${d[0]} ${st.seen.includes(d[0])?'· EXAMINADO':''}</span><h3>${esc(d[1])}</h3><p class="muted">Documento de investigación</p><button onclick="openDoc(${i},${j})">Examinar documento ↗</button></div>`).join('');return header(`Sobre ${i+1} · ${c.title}`,c.desc)+`<div class="row"><span class="chip">${c.docs.filter(d=>st.seen.includes(d[0])).length}/${c.docs.length} documentos examinados</span><span class="chip">Fase ${i+1} de 6</span></div><h3>Documentación y evidencias</h3><div class="grid">${docs}${photos}</div>${i===1?`<div class="result">Podéis realizar interrogatorios en la sección lateral. Algunas preguntas de confrontación se activan al obtener las pruebas pertinentes.</div><button onclick="goto('interrogatorios')">Ir a interrogatorios →</button>`:''}${i===2?`<div class="result">Reconstruid el orden de los acontecimientos en la sección Cronología para contrastar las coartadas.</div><button onclick="goto('cronologia')">Abrir cronología →</button>`:''}${i===5?finalForm():gate(i,c)}`}
function gate(i,c){return `<div class="gate"><h3>🔐 Desbloqueo del sobre ${i+2}</h3><p>Para continuar, examinad todos los documentos de esta fase y responded una cuestión deductiva. Las respuestas incorrectas no penalizan.</p><label class="label">${c.gate.question}</label><select id="gatechoice"><option value="">Elegid vuestra conclusión…</option>${c.gate.options.map((x,j)=>`<option value="${j}">${esc(x)}</option>`).join('')}</select><button class="primary" onclick="checkGate(${i})">Verificar y abrir siguiente sobre</button><div id="gatefeedback"></div></div>`}
function checkGate(i){let c=CH[i];let missing=c.docs.filter(d=>!st.seen.includes(d[0]));if(missing.length){$('gatefeedback').innerHTML=`<div class="result error">Antes de avanzar, examinad ${missing.length} documento(s) pendiente(s).</div>`;return}let v=Number($('gatechoice').value);if($('gatechoice').value===''||v!==c.gate.correct){$('gatefeedback').innerHTML='<div class="result error">Esa interpretación no encaja con las pruebas. Contrastad los documentos.</div>';return}st.stage=Math.max(st.stage,i+1);st.current=i+1;save();render();$('content').scrollIntoView({behavior:'smooth'});}
function interview(){return header('Sala de interrogatorios','Elegid a quién interrogar. Las confrontaciones se activan al leer las pruebas.')+`<div class="grid">${SUS.map((s,k)=>`<div class="card"><h3>${s.name}</h3><p class="muted">${s.role}</p><p>${s.base}</p><button onclick="showInterview(${k})">Interrogar →</button></div>`).join('')}</div><div id="interviewArea" class="card" style="margin-top:20px"><p class="muted">Seleccionad a una persona para comenzar.</p></div>`}
function showInterview(k){let s=SUS[k];$('interviewArea').innerHTML=`<h3>${s.name}</h3><p>Elegid una pregunta. No todas las respuestas son verificables.</p><div class="grid">${s.qs.map((q,j)=>{let req=q[0].match(/\(([^)]+)\)/);let ids=req?req[1].split('/'):[];let enabled=!req||ids.every(id=>st.seen.includes(id));return `<button ${enabled?'':'disabled title="Leed antes la prueba indicada"'} onclick="ask(${k},${j})">${esc(q[0])}${enabled?'':' 🔒'}</button>`}).join('')}</div><div id="answer"></div>`}
function ask(k,j){let s=SUS[k],q=s.qs[j];st.interviews[s.id+':'+j]=true;save();$('answer').innerHTML=`<div class="result"><span class="label">DECLARACIÓN REGISTRADA · ${s.name}</span><p>«${esc(q[1])}»</p></div>`}
function board(){let docs=CH.slice(0,st.stage+1).flatMap(c=>c.docs).filter(d=>st.seen.includes(d[0]));return header('Tablero de conexiones','Seleccionad dos pruebas para registrar una relación y escribir qué demuestra.')+`<div class="split"><div><h3>Prueba A</h3><select id="a"><option value="">Seleccionar…</option>${docs.map(d=>`<option>${d[0]} · ${esc(d[1])}</option>`).join('')}</select></div><div><h3>Prueba B</h3><select id="b"><option value="">Seleccionar…</option>${docs.map(d=>`<option>${d[0]} · ${esc(d[1])}</option>`).join('')}</select></div></div><p><textarea id="reason" placeholder="¿Qué relación encontráis? ¿Qué no demuestra todavía?"></textarea></p><button class="primary" onclick="connectEvidence()">Conectar pruebas</button><div id="boardmsg"></div><h3>Conexiones registradas (${st.links.length})</h3><div class="grid">${st.links.map((l,i)=>`<div class="card"><span class="label">${esc(l.a)} ↔ ${esc(l.b)}</span><p>${esc(l.why)}</p><button onclick="removeLink(${i})">Quitar</button></div>`).join('')||'<p class="muted">Todavía no habéis conectado pruebas.</p>'}</div>`}
function connectEvidence(){let a=$('a').value,b=$('b').value,why=$('reason').value.trim();if(!a||!b||a===b||why.length<15){$('boardmsg').innerHTML='<div class="result error">Seleccionad dos pruebas distintas y explicad su relación (15 caracteres como mínimo).</div>';return}st.links.push({a,b,why});save();render()}function removeLink(i){st.links.splice(i,1);save();render()}
function chrono(){let unlocked=st.stage>=2;return header('Cronología de la noche','Construid una secuencia temporal a partir de los registros, no de las coartadas.')+(unlocked?`<p>Elegid el siguiente acontecimiento de la secuencia. Podéis corregir errores antes de comprobar.</p><div class="timeline">${TIMES.map((x,i)=>`<button ${st.order.includes(i)?'disabled':''} onclick="addTime(${i})">${x[1]}</button>`).join('')}</div><h3>Vuestra reconstrucción</h3><div class="card">${st.order.map((n,i)=>`<p>${i+1}. ${TIMES[n][1]} <button onclick="removeTime(${i})">✕</button></p>`).join('')||'Sin eventos ordenados.'}</div><div class="row"><button onclick="verifyTime()">Comprobar secuencia</button><button onclick="st.order=[];save();render()">Limpiar</button></div><div id="timemsg"></div>`:'<div class="result">Se desbloquea cuando lleguéis al sobre 3.</div>')}
function addTime(i){st.order.push(i);save();render()}function removeTime(i){st.order.splice(i,1);save();render()}function verifyTime(){$('timemsg').innerHTML=st.order.length!==TIMES.length?'<div class="result error">Faltan acontecimientos.</div>':st.order.every((v,i)=>v===i)?'<div class="result success">Secuencia correcta. Ahora comparad los testimonios con los registros.</div>':'<div class="result error">Hay al menos un acontecimiento fuera de orden. Revisad horas en los registros.</div>'}
function notebook(){return header('Cuaderno de investigación','Anotad teorías, dudas, coartadas y pruebas pendientes. Se guarda automáticamente.')+`<textarea id="notes" style="min-height:430px" placeholder="Nuestras hipótesis…">${esc(st.notes)}</textarea><p><button onclick="st.notes=$('notes').value;save();$('saved').textContent='Guardado'">Guardar notas</button> <span id="saved" class="muted"></span></p>`}
function finalForm(){if(st.solved)return reveal();return `<div class="gate"><h3>Informe final de acusación</h3><p>Antes de revelar la solución, justificad vuestra hipótesis con la ruta, la ventana temporal y al menos dos pruebas independientes. El juego no se resuelve mediante palabras clave.</p><label class="label">Persona acusada</label><select id="culprit"><option value="">Elegid…</option>${SUS.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select><label class="label">Reconstrucción y método</label><textarea id="how" placeholder="¿Cómo y cuándo sucedió?"></textarea><label class="label">Motivo</label><textarea id="why" placeholder="¿Qué motivación proponéis?"></textarea><label class="label">Pruebas y dudas</label><textarea id="proof" placeholder="Citad al menos dos evidencias y explicad sus limitaciones."></textarea><button class="primary" onclick="submitAccusation()">Presentar acusación y sellar expediente</button><div id="finalmsg"></div></div>`}
function submitAccusation(){let who=$('culprit').value,how=$('how').value.trim(),why=$('why').value.trim(),proof=$('proof').value.trim();if(!who||how.length<35||why.length<20||proof.length<50){$('finalmsg').innerHTML='<div class="result error">Completad los cuatro apartados con una explicación suficiente antes de cerrar el caso.</div>';return}st.accusation={who,how,why,proof};st.solved=true;save();render()}
function reveal(){let a=st.accusation;return `<div class="secret"><h3>Expediente cerrado · solución desbloqueada</h3><p>Habéis presentado vuestra acusación contra <strong>${esc(SUS.find(s=>s.id===a.who).name)}</strong>. Comparad ahora vuestro razonamiento con la reconstrucción oficial.</p><button class="primary" onclick="document.getElementById('official').hidden=false">Abrir solución oficial (spoilers)</button><div id="official" hidden><div class="divider"></div><h2>La responsable: Clara Vega</h2><p>Clara entró al despacho por el paso de servicio utilizando C-04 hacia las 22:10. Entre 22:11 y 22:16 golpeó a Gabriel con el pisapapeles y salió hacia la sala de arte. Temía que la inspección del cuadro al día siguiente revelara irregularidades en una obra bajo su custodia.</p><p><strong>Convergencia:</strong> el registro C-04 y el fotograma S2 encajan con la ventana forense; la fibra azul con pigmento verde es compatible con su bata y su trabajo; el sonido de ventilación del invernadero no acredita su coartada.</p><p><strong>Los otros secretos:</strong> Bruno pausó P1 para extraer documentación contable; Diego mintió sobre su ronda; Ada discutió por la herencia. Sus mentiras no bastan para atribuirles el crimen.</p><p><strong>Límite:</strong> es la explicación más consistente dentro del caso ficticio, no una identificación científica irrefutable: tarjeta, fibra y silueta no identifican de modo único.</p><p>Vuestra acusación: ${a.who==='Clara'?'acertasteis la persona responsable.':'no coincide con la reconstrucción prevista.'}</p></div></div>`}
function hint(){let hints=['Pensad en las rutas que no vigila P1.','No confundáis la actividad de un aparato con la presencia de una persona.','Unid un registro de acceso, un fotograma y una microtraza.'];let h=hints[Math.min(st.hints,hints.length-1)];st.hints++;save();alert('PISTA OPCIONAL '+st.hints+'\n\n'+h)}function reset(){if(confirm('¿Borrar todo el progreso de esta partida?')){localStorage.removeItem(KEY);location.reload()}}
function render(){let v=st.view;$('nav').innerHTML=nav();$('progress').textContent=`SOBRE ${Math.min(st.stage+1,6)}/6`;let content=v==='inicio'?intro():v==='fase'?phase(st.current??st.stage):v==='interrogatorios'?interview():v==='tablero'?board():v==='cronologia'?chrono():v==='cuaderno'?notebook():intro();$('content').innerHTML=content;save()}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});setInterval(()=>{let sec=Math.floor((Date.now()-st.started)/1000);$('clock').textContent=`${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`},1000);render();
</script></body></html>
